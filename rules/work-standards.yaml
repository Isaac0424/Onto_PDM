# 작업표준서 (PDM 소유). 대상: 한화 협동로봇 HCR-A(2G) 시리즈 HCR-3A · HCR-5A · HCR-12A의 **설치 · 점검 작업**(사용설명서 3 · 7 · 15장)과
# **CAD 구조에서 뽑은 본체 체결 부품 목록**.
# 사용설명서는 설치 · 운영 설명서라서 **공장의 로봇 암 본체 조립 절차는 어디에도 없다.** 그래서 본체 조립은 구조(어느 조립품에 어떤 부품이 몇 개)만 CAD 에서 옮기고
# 절차(순서 · 토크 · 공구 · 시간)는 쓰지 않았다 — 공백은 gaps.yaml 에 있다.
#
# 모든 단계 · 확인 항목 · 수량에 source(manual · cad · unknown)와 ref 가 있다. 단계 순서는 사용설명서의 절 순서를 따른 것이며,
# 매뉴얼이 "이 순서로 해야 한다"고 명시한 곳은 `order_binding: manual` 로 따로 표시했다(나머지는 G-015).
# 값(토크 · 볼트 규격)의 정본은 규칙(rules.yaml)이고 단계는 `rules:` 로 가리킨다. 읽기 쉽게 단계 문장에 값을 옮겨 적은 곳(WS-HCR-INS-02 단계 3)은
# rules/tests/test_rules.py 가 규칙의 값과 같은지 비교한다 — 값을 고칠 때는 규칙을 먼저 고치고 시험이 알려 주는 문장을 맞춘다.

version: 1

work_standards:
  # ===================== 설치 =====================
  WS-HCR-INS-01:
    title: 설치 장소 · 유형 확인과 운반
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 로봇을 설치하기 전에 장소와 설치 유형을 확인하고 안전하게 옮긴다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-SIT-001, AR-SIT-002, AR-SIT-003]
    tools: []
    steps:
      - {seq: 1, operation: SiteCheck, rules: [AR-SIT-001], text: "설치 장소가 권장 조건(내진 설계 건물 · 누수 없음 · 인화성 및 폭발 물질 없음 · 온도와 습도 일정 · 먼지 유입 적음)을 만족하는지 확인한다.", source: manual, ref: {doc: UG-KR, sec: "3.1", page: 47}}
      - {seq: 2, operation: SiteCheck, rules: [AR-SIT-002], text: "설치 유형(바닥 · 벽면 · 천장)을 정한다. HCR-12A 는 바닥과 천장에만 설치할 수 있다.", source: manual, ref: {doc: UG-KR, sec: "3.2", page: 48}}
      - {seq: 3, operation: SiteCheck, rules: [AR-SIT-002], condition: 대차 · 고정 포스트에 설치하는 경우, text: "로봇을 대차에 설치했다면 작동할 때 반드시 대차를 지면에 고정한다. 대차와 고정 포스트는 제품에 포함되어 있지 않다.", source: manual, ref: {doc: UG-KR, sec: "3.2", page: 48}}
      - {seq: 4, operation: Handling, rules: [AR-SIT-003], text: "로봇 암과 컨트롤러를 옮긴다. 컨트롤러는 상단의 손잡이로 운반한다. 무게는 모델별로 다르다(규칙 AR-SIT-003).", source: manual, ref: {doc: UG-KR, sec: "2.6", page: 43}}
    checks:
      - {text: 설치 장소가 권장 조건을 만족한다, criterion: {text: "권장하는 장소에 설치하지 않으면 로봇의 성능 및 수명이 감소될 수 있다"}, source: manual, ref: {doc: UG-KR, sec: "3.1", page: 47}}

  WS-HCR-INS-02:
    title: 로봇 암 베이스 고정
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 로봇 암을 볼트 4개로 설치면에 정해진 토크로 고정한다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-FAS-001, AR-FAS-002, AR-FAS-003, AR-LOC-001, AR-SAF-001]
    tools: [TL-TORQUE]
    steps:
      - {seq: 1, operation: BaseMounting, condition: 설치면의 평면도 · 강성이 로봇 암을 지지하기에 부족한 경우, text: "고정 베이스를 이용해 설치한다.", source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}}
      - {seq: 2, operation: PinLocating, rules: [AR-LOC-001], condition: 로봇 암을 정확한 위치에 설치하려는 경우(선택), text: "위치 결정 핀 2개로 설치 위치를 정한다. 핀 지름은 HCR-3A Φ5 · HCR-5A Φ8 · HCR-12A Φ5 mm.", source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}}
      - {seq: 3, operation: BoltFastening, rules: [AR-FAS-001], text: "로봇 암을 볼트 4개로 천장 · 벽면 · 바닥에 고정한다. 볼트와 토크: HCR-3A M6×15 mm 30 N·m, HCR-5A M8×15 mm 45 N·m, HCR-12A M12×25 mm 140 N·m.", source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}, targets: [{role: robot_base_mount, quantity: 4, source: manual}]}
      - {seq: 4, operation: BoltFastening, rules: [AR-FAS-002], text: "정전기 방지를 위해 M4×10 mm 볼트로 접지 라인을 연결한다. 체결 토크는 매뉴얼에 없다(G-003).", source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}}
      - {seq: 5, operation: CoverFitting, rules: [AR-FAS-003], condition: HCR-3A · HCR-5A, text: "동봉된 로봇 고정 볼트 커버 4개를 덮는다.", source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}}
    precautions: [AR-SAF-001]            # 조립되어 있는 볼트는 분해하지 않는다
    checks:
      - {text: 로봇 암의 설치면이 베이스면과 완전히 밀착되었는지 확인한다, criterion: {text: 완전 밀착}, source: manual, ref: {doc: UG-KR, sec: "3.3", page: 49}}
      - {text: 로봇 암을 작동하기 전에 모든 볼트가 잘 고정되어 있는지 확인한다, criterion: {text: 모든 볼트 고정}, source: manual, ref: {doc: UG-KR, sec: "3.3", page: 50}}

  WS-HCR-INS-03:
    title: 툴 장착과 TCP 설정
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 툴 플랜지에 툴을 고정하고 케이블을 연결한 뒤 TCP를 입력한다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-FAS-004, AR-CON-004, AR-CFG-002]
    tools: [TL-TORQUE]
    steps:
      - {seq: 1, operation: ToolMounting, rules: [AR-FAS-004], text: "M6 볼트 4개로 툴 플랜지(ISO 9409-1-50-4-M6)에 툴을 고정한다. 볼트 길이와 토크는 툴마다 다르다(툴 제조사 사용설명서, G-002). 툴과 M6 볼트는 제품에 포함되지 않는다.", source: manual, ref: {doc: UG-KR, sec: "3.4", page: 50}, targets: [{role: tool_mount, quantity: 4, source: manual}]}
      - {seq: 2, operation: Wiring, rules: [AR-CON-004], text: "툴을 고정한 후 툴 I/O 또는 EtherCAT 포트에 필요한 케이블을 연결한다. 핀 맵은 Appendix E.", source: manual, ref: {doc: UG-KR, sec: "3.4, App. E", page: [50, 51, 263]}, order_binding: manual}
      - {seq: 3, operation: Configuration, rules: [AR-CFG-002], condition: 툴을 처음 장착한 경우, text: "TCP(툴 끝 위치 · 방향 · 무게 · 무게 중심)를 설정한다.", source: manual, ref: {doc: UG-KR, sec: "7.2", page: [96, 97]}}
    checks:
      - {text: 로봇을 가동하기 전에 TCP 의 유형에 따라 정확한 값을 입력했다, criterion: {text: "반드시 정확한 값을 입력(잘못 입력하면 충돌 · 협착 위험)"}, source: manual, ref: {doc: UG-KR, sec: "7.2", page: 96}}

  WS-HCR-INS-04:
    title: 컨트롤러 고정과 케이블 · 전원 · I/O 연결
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 컨트롤러를 두고 티칭 펜던트 · 로봇 암 · 전원 · I/O 를 연결한다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-FAS-005, AR-CON-001, AR-CON-002, AR-CON-003, AR-CFG-003]
    tools: [TL-TORQUE]
    steps:
      - {seq: 1, operation: ControllerMounting, rules: [AR-FAS-005], condition: 컨트롤러를 지면에 고정하는 경우(선택), text: "하단의 고정용 브라켓에 M14 45 mm 이상 볼트를 평와셔와 함께 조합해 고정한다. 볼트와 나사는 제품에 포함되지 않는다. 체결 토크는 매뉴얼에 없다(G-004).", source: manual, ref: {doc: UG-KR, sec: "3.6", page: 55}}
      - {seq: 2, operation: Wiring, rules: [AR-CON-001], text: "티칭 펜던트 케이블을 컨트롤러에 연결한 다음 고정용 걸쇠를 건다.", source: manual, ref: {doc: UG-KR, sec: "3.5", page: 52}}
      - {seq: 3, operation: Wiring, rules: [AR-CON-001], text: "로봇 암의 케이블을 컨트롤러에 연결한 다음 고정용 걸쇠를 건다. 3A · 5A 컨트롤러와 12A 컨트롤러는 커넥터 위치가 다르다.", source: manual, ref: {doc: UG-KR, sec: "3.5", page: 53}}
      - {seq: 4, operation: Wiring, rules: [AR-CON-002], text: "전원 단자에 나라별 전원 케이블을 연결한다(표준 IEC 플러그). 입력전원 100 ~ 240 VAC, 외부 전원 퓨즈 8 ~ 16 A, 50 ~ 60 Hz. 접지 · 메인 퓨즈 · 누전 차단기는 구매자나 설치하는 사람이 준비한다.", source: manual, ref: {doc: UG-KR, sec: "3.5", page: 54}}
      - {seq: 5, operation: Wiring, rules: [AR-CON-003], text: "I/O 배선은 제어기 전원을 끈 뒤 I/O 커넥터에 사전 배선한다.", source: manual, ref: {doc: UG-KR, sec: "3.7", page: 56}, order_binding: manual}
      - {seq: 6, operation: Configuration, rules: [AR-CFG-003], condition: HCR-12A, text: "제어기와 로봇바디의 시리얼 번호가 일치하는지 확인한다.", source: manual, ref: {doc: UG-KR, sec: "1.1", page: 14}}
    checks:
      - {text: 로봇이 켜진 상태에서 로봇 · 전원 · 티칭 펜던트 커넥터를 뽑지 않았다, criterion: {text: 금지 사항(주의)}, source: manual, ref: {doc: UG-KR, sec: "3.5", page: 54}}
      - {text: 티칭 펜던트 연결 시 커넥터의 Pin 을 확인했다, criterion: {text: Pin 확인(주의)}, source: manual, ref: {doc: UG-KR, sec: "3.5", page: 54}}

  WS-HCR-INS-05:
    title: 설치 후 설치 각도 설정 · 값 확인 · 위험성 평가
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 로봇을 가동하기 전에 설치 유형에 맞는 값을 입력하고 안전을 확인한다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-CFG-001, AR-CFG-004]
    tools: []
    steps:
      - {seq: 1, operation: Configuration, rules: [AR-CFG-001], text: "로봇 설정 > 마운팅에서 설치 각도를 설정한다: 바닥 0°, 벽 90°, 천장 180°. HCR-12A 는 바닥(0°) · 천장(180°)만, X · Y 축 방향 ±30° 이내.", source: manual, ref: {doc: UG-KR, sec: "7.1", page: [93, 94, 95]}, order_binding: manual}
      - {seq: 2, operation: Configuration, rules: [AR-CFG-004], text: "설치 각도 · 툴 설정 · 안전 설정 등의 값이 올바르게 입력되었는지 확인한다.", source: manual, ref: {doc: UG-KR, sec: "2.2", page: 38}}
      - {seq: 3, operation: Configuration, rules: [AR-CFG-004], text: "위험성 평가를 수행한다(ISO 12100 · ISO 10218-2 · ISO/TS 15066 참조). 설치한 직후에 반드시 한다. 사내 절차는 작성이 필요하다(G-012).", source: manual, ref: {doc: UG-KR, sec: "2.12", page: 46}, order_binding: manual}
    checks:
      - {text: 설치 유형에 맞는 각도를 입력했다, criterion: {text: "자동으로 인식하지 못하므로 가동 전에 정확한 값을 입력"}, source: manual, ref: {doc: UG-KR, sec: "7.1", page: 93}}

  # ===================== 점검 =====================
  WS-HCR-MNT-01:
    title: 정기 점검 항목과 주기
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 로봇을 최상의 상태로 유지하기 위해 항목별 주기로 점검한다
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-MNT-001, AR-MNT-004]
    tools: []
    steps: []                             # 이 문서는 절차가 아니라 항목표다. 절차는 WS-HCR-MNT-02 · 03
    inspection_items:                     # 사용설명서 15.1 표 8건. 합격 기준은 없다(G-013)
      - {seq: 1, group: 로봇 암, target: 전체, check: "로봇에 적용한 프로그램에 따라 의도한 위치로 이동하는지 확인합니다.", cycle: {value: 1, unit: 일, label: 매일}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}}
      - {seq: 2, group: 로봇 암, target: 전체, check: "얼룩, 먼지 등 오염물질 제거합니다.", cycle: {value: 3, unit: 개월}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}}
      - {seq: 3, group: 로봇 암, target: 전체, check: "서보 전원을 켜고 끌 때 로봇 암이나 툴이 아래로 쳐지지 않는지 확인합니다.", cycle: {value: 1, unit: 일, label: 매일}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}}
      - {seq: 4, group: 로봇 암, target: 주요 볼트, check: "로봇 외부에 노출되는 볼트가 느슨해 지지 않았는지 확인합니다.", cycle: {value: 3, unit: 개월}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}}
      - {seq: 5, group: 로봇 암, target: 모터, check: "이상 발열이나 소음이 발생하는지 확인합니다.", cycle: {value: 1, unit: 일, label: 매일}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}}
      - {seq: 6, group: 로봇 컨트롤러, target: 케이블, check: "케이블 연결 상태를 확인합니다.", cycle: {value: 6, unit: 개월}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}, cycle_note: "표의 병합 셀로 읽은 값(텍스트 추출 기준): 6개월이 컨트롤러 3행(케이블 · 내부 · 필터)에 걸친다고 해석했다. 원본 표로 확인 필요"}
      - {seq: 7, group: 로봇 컨트롤러, target: 내부, check: "내부의 먼지를 제거합니다.", cycle: {value: 6, unit: 개월}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}, cycle_note: 위와 같다}
      - {seq: 8, group: 로봇 컨트롤러, target: 필터, check: "필터의 먼지를 제거합니다.", cycle: {value: 6, unit: 개월}, source: manual, ref: {doc: UG-KR, sec: "15.1", page: 229}, cycle_note: 위와 같다}
    event_checks:
      - {event: "120°/sec 이상의 속도로 구동 중 충돌 또는 비상정지가 발생한 경우", rules: [AR-MNT-004], text: "관절 영점을 확인한다. 이상이 있으면 영점을 조절한 뒤 툴의 이동 경로가 정확한지 확인한다. 영점 조절은 구매처에 문의한다(G-017).", source: manual, ref: {doc: UG-KR, sec: "2.7", page: 44}}
    checks: []

  WS-HCR-MNT-02:
    title: 로봇 암 확인 및 청소
    models: [HCR-3A, HCR-5A, HCR-12A]
    purpose: 로봇 암의 케이블 · 외부 나사 · 모터 · 브레이크 · 감속기와 오염을 확인한다 (최소 6개월마다)
    status: unreviewed
    revision: R00 (초안, 사람 검토 전)
    standard_time: {value: null, source: unknown, gap: G-006}
    rules: [AR-MNT-002]
    tools: []
    steps:
      - {seq: 1, operation: Inspection, rules: [AR-MNT-002], text: "로봇 암의 자세를 초기(Home) 위치로 전환한다.", source: manual, ref: {doc: UG-KR, sec: "15.2", page: 230}, order_binding: manual}
      - {seq: 2, operation: Inspection, rules: [AR-MNT-002], text: "로봇 컨트롤러의 전원을 끈다.", source: manual, ref: {doc: UG-KR, sec: "15.2", page: 230}, order_binding: manual}
      - {seq: 3, operation: Inspection, rules: [AR-MNT-002], text: "컨트롤러와 로봇 암을 연결하는 케이블에 이상이 없는지, 외부에 노출된 나사가 느슨해지거나 풀리지 않았는지, 모터 · 브레이크 · 감속기 등에 이상이 없는지 확인한다.", source: manual, ref: {doc: UG-KR, sec: "15.2", page: 230}, order_binding: manual}
