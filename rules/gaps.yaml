# 작성이 필요한 공백 목록. 근거가 없어 값을 비워 둔 곳은 모두 여기 번호로 연결된다(`gap: G-0xx`).
# 값을 채우려면: 근거(사내 작업표준서 · 도면 · 제조사 답변 · 표준 원문)를 구한 뒤 해당 항목의 source 를 바꾸고 이 목록에서 지운다.
# needs: 무엇이 필요한가 · who: 구할 수 있는 곳 · blocks: 이 공백 때문에 비어 있는 항목

version: 1

gaps:
  G-001:
    title: 소켓 헤드 볼트(M3 · M4) 체결 토크
    needs: 로봇 암 본체(커버 · 관절 하우징)에 쓰이는 M3 · M4 소켓 헤드 볼트의 체결 토크와 조임 방식
    why: 사용설명서는 설치 · 운영 설명서라 본체 조립 토크를 말하지 않는다. 일반 표준값은 강도 등급 · 마찰 조건에 따라 달라 단일 숫자를 만들지 않았다.
    who: 제조사 설계 · 사내 체결 기준표(작업표준서), 또는 강도 등급이 확정된 뒤 ISO 898-1 · VDI 2230 에 따른 설계 승인
    blocks: [AR-FAS-006]
  G-002:
    title: 툴 고정 M6 볼트의 길이와 체결 토크
    needs: 툴 플랜지(ISO 9409-1-50-4-M6)에 툴을 고정하는 M6 볼트의 길이 · 토크
    why: 매뉴얼은 "툴마다 다를 수 있다. 툴 제조사 사용설명서를 참조"라고만 한다(3.4 p.50).
    who: 툴 제조사 사용설명서
    blocks: [AR-FAS-004]
  G-003:
    title: 접지 라인 M4×10 볼트 체결 토크
    needs: 정전기 방지 접지 라인 볼트의 체결 토크
    why: 3.3 p.49 는 볼트 규격(M4×10)만 정한다.
    who: 제조사 · 사내 기준
    blocks: [AR-FAS-002]
  G-004:
    title: 컨트롤러 고정 M14 볼트 체결 토크
    needs: 컨트롤러 하단 브라켓 고정 볼트(M14, 45 mm 이상, 평와셔 조합)의 체결 토크
    why: 3.6 p.55 는 규격과 와셔 조합만 정한다.
    who: 제조사 · 사내 기준
    blocks: [AR-FAS-005]
  G-005:
    title: 로봇 암 공장 조립 절차
    needs: 서브 조립 순서(1번 암 · 2번 암 · J1~J6 · 툴 I/O), 체결 순서 · 패턴(대각선 등), 사용 공구, 지그
    why: 사용설명서에는 제조 조립 절차가 없다. CAD 는 구조(누가 어느 조립품에 몇 개 들어가는가)만 준다.
    who: 제조사 조립 작업표준서 · 사내 공정 담당
    blocks: [AR-FAS-006, WS-HCR12A-ASM-01, WS-HCR3A5A-ASM-01]
  G-006:
    title: 작업 표준 시간
    needs: 단계별 표준 작업 시간
    why: 근거 자료가 전혀 없다. 비워 두었다.
    who: 사내 공정 분석(시간 연구)
    blocks: [work-standards 전체의 standard_time]
  G-007:
    title: 공구 사양
    needs: 토크 렌치의 범위(30 · 45 · 140 N·m를 모두 덮는지), 육각 렌치 크기, 진공 청소기 · 공기 압축기 사양
    why: 매뉴얼은 공구를 이름으로 정하지 않는다. 육각 구멍 크기는 형상 분류기가 M3=2.5 · M4=3 mm로 추정했을 뿐이다.
    who: 사내 공구 관리 · 제조사
    blocks: [TL-TORQUE, TL-HEXKEY, TL-VACUUM]
  G-008:
    title: 볼트의 머리 모양 · 강도 등급 · 재질 · 표면처리
    needs: 로봇 고정 볼트(M6 · M8 · M12) 등의 머리 모양 · 강도 등급 · 재질 · 표면처리 · 나사 방향
    why: OPMS 볼트 분류는 강도 등급 · 재질 · 표면처리 · 피치 · 나사 방향을 필수 속성으로 요구하지만 사용설명서 · CAD 에 없다(OPMS 시연 데이터의 값은 가상).
    who: 설계 BOM · 구매 사양서
    blocks: [AR-FAS-001, AR-FAS-006]
  G-009:
    title: HCR-5A STEP 에 로봇 고정 볼트 커버 부품이 없다
    needs: 5A 의 로봇 고정 볼트 커버(4개) CAD 부품 또는 BOM
    why: 매뉴얼은 3A · 5A 에 4개씩 동봉이라 하는데(1.2 p.15, 3.3 p.49), STEP 에서는 3A 의 HCR3A_BASE_COVER_BOLT_1(4개)만 보인다.
    who: 제조사 CAD · 설계
    blocks: [AR-FAS-003]
  G-010:
    title: 3A 베이스 커버 볼트의 형상 분류 불확실
    needs: HCR3A_BASE_COVER_BOLT_1 이 매뉴얼의 '로봇 고정 볼트 커버'인지 확인
    why: 형상 분류기가 접시머리 · 십자 구멍(신뢰도 0.6)으로 읽었고 두 몸체로 이뤄져 있다. 이름만으로 추정했다.
    who: 설계 확인
    blocks: [AR-FAS-003]
  G-011:
    title: 위치 결정 핀의 길이 · 공차 · 재질 · 부품 번호
    needs: 위치 결정 핀 사양
    why: 매뉴얼은 지름(Φ5 · Φ8 · Φ5)과 개수(2개)만 정한다.
    who: 제조사 설치면 도면(Appendix C 는 치수 그림만 있다)
    blocks: [AR-LOC-001]
  G-012:
    title: 위험성 평가의 사내 절차
    needs: 위험성 평가 방법 · 체크리스트 · 책임자
    why: 매뉴얼은 ISO 12100 · ISO 10218-2 · ISO/TS 15066 을 따르라고만 하고 절차를 주지 않는다(2.12 p.46).
    who: 사내 안전 담당
    blocks: [WS-HCR-INS-05]
  G-013:
    title: 점검 합격 기준(수치)
    needs: 볼트 풀림 · 발열 · 소음 · 처짐의 판정 기준
    why: 15.1 의 점검 사항은 "확인합니다"라고만 하고 합격 수치가 없다.
    who: 제조사 · 사내 정비 기준
    blocks: [WS-HCR-MNT-01]
  G-014:
    title: 용접 · 압입 공정의 근거 없음
    needs: (이 로봇 구성에서는 필요 없을 수 있다)
    why: 사용설명서 · STEP 에 용접 · 압입이 없다. 이전 가상 회사 규칙(용접 조건표, H7/p6)은 삭제했다.
    who: 해당 공정이 생기면 사내 용접절차서(WPS) · 끼워맞춤 기준
    blocks: [operations.not_covered.Welding, operations.not_covered.PressFit]
  G-015:
    title: 설치 · 연결 단계의 필수 순서
    needs: 로봇 암 고정 → 컨트롤러 연결 → 설정 사이의 반드시 지킬 순서가 있는지
    why: "매뉴얼은 3.1~3.7 절 순서로 설명할 뿐 \"이 순서로 해야 한다\"고 못박지 않는다(예외: 전원을 끈 뒤 I/O 배선 3.7, 설치 후 각도 설정 7.1). work-standards 의 단계 순서는 절 순서를 따른 것이다."
    who: 제조사 · 설치 담당
    blocks: [WS-HCR-INS-02, WS-HCR-INS-03, WS-HCR-INS-04]
  G-016:
    title: 일반 체결 토크 표준값
    needs: 강도 등급별 일반 체결 토크 표
    why: ISO 898-1 강도 등급과 마찰 조건에 의존하는 값이라 단일 숫자를 확정값처럼 쓰지 않는다. 표준 원문을 확인하고 설계 승인을 받은 뒤 source 를 standard 로 추가한다.
    who: 설계 승인 · 표준 원문(ISO 898-1, VDI 2230)
    blocks: [AR-FAS-006]
  G-017:
    title: 영점 설정(캘리브레이션) 절차
    needs: 영점 설정 방법 · 허용 오차
    why: 영점 설정 메뉴는 Super Admin 전용이고 필요하면 구매처에 연락하라고만 한다(6.2 p.89, 2.7 p.44).
    who: 제조사 · 구매처
    blocks: [operations.not_covered.ZeroPointAdjustment, AR-MNT-004]
  G-019:
    title: BOLT-M4 의 길이
    needs: 12A J2 · 툴 I/O 조립품에 쓰인 BOLT-M4(23개)의 길이
    why: CAD 이름에 길이가 없고 모델이 머리만 있어(형상 분류기가 headOnly 로 판정) 길이를 잴 수 없다.
    who: 설계 BOM · 제조사 CAD
    blocks: [WS-HCR12A-ASM-01]
  G-018:
    title: 컨트롤러 조립 절차와 커버 잠금 나사 사양
    needs: 컨트롤러(HCP2) 내부 조립 순서, "로봇 컨트롤러 커버 잠금 나사"의 규격 · 토크
    why: 사용설명서는 컨트롤러 구성 요소의 이름(1.5 p.24)만 주고 조립 · 나사 사양이 없다. CAD(컨트롤러 STEP)에는 볼트 부품이 없었다.
    who: 제조사
    blocks: []
