[project]
name = "onto-pdm"
version = "0.1.0"
description = "Onto PDM 백엔드: CAD · BOM · 사양서 관리, 조립 규칙, 부품 매칭, Neo4j 그래프 발행"
readme = "README.md"
requires-python = ">=3.12"
# 버전은 OPMS(parts-registry)의 pyproject.toml 고정 버전과 같다. 같은 가상환경에 합칠 수 있게 맞춘다.
dependencies = [
    "fastapi==0.162.0",
    "neo4j==6.4.1",
    "pydantic==2.14.2",
    "typer==0.27.3",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
onto-pdm = "onto_pdm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto_pdm"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
# Neo4j(일회용 Docker 컨테이너)가 필요한 시험은 기본 실행에서 뺀다: pytest -m neo4j tests/neo4j
testpaths = ["tests/unit"]
markers = [
    "neo4j: 일회용 Neo4j 컨테이너(docker)가 필요한 시험. 기본 실행에서 빠진다 (tests/neo4j)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
