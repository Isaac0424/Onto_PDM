<title>분해도 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one instrument frame (3D stage + step caption) beside a control column; stacks to one column on phones. Dark single look, brass accent. */
:root {
  --bg: #0c0d0f;
  --panel: #141619;
  --panel-2: #1a1d21;
  --line: #2a2e33;
  --ink: #ece6da;
  --muted: #8f8b83;
  --faint: #5d5b57;
  --accent: #e3a648;
  --accent-soft: rgba(227, 166, 72, .14);
  --danger: #e07a5f;
  --f-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-sans); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
@media (min-width: 960px) { .app { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }

.topbar { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand .model { color: var(--muted); font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
@media (max-width: 520px) { .clock { display: none; } }
.topright { display: flex; align-items: center; gap: 12px; }
.skinbtn { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 4px 12px; }
.skinbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-soft); }
.clock { font-family: var(--f-mono); color: var(--muted); font-size: 13px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }

/* instrument frame */
.frame { border: 1px solid var(--line); background: var(--bg); position: relative; min-width: 0; }
.stage { position: relative; width: 100%; aspect-ratio: 1 / 1.22; max-height: 80vh; overflow: hidden;
  background: radial-gradient(60% 45% at 45% 72%, rgba(227,166,72,.10), transparent 70%); touch-action: none; }
@media (min-width: 960px) { .stage { aspect-ratio: auto; height: min(70vh, 700px); } }
.stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.dashes { position: absolute; top: 14px; left: 16px; display: flex; gap: 4px; max-width: 45%; flex-wrap: wrap; pointer-events: auto; }
.dashes button { width: 16px; height: 14px; border: 0; padding: 0; background: transparent; position: relative; }
.dashes button::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 3px; background: var(--line); }
.dashes button.on::after { background: var(--ink); }
.specs { position: absolute; top: 12px; right: 16px; text-align: right; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; line-height: 1.7; max-width: 55%; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.leaders polyline { fill: none; stroke: var(--muted); stroke-width: 1; opacity: .7; }
.leaders polyline.on { stroke: var(--accent); opacity: 1; }
.leaders circle { fill: var(--muted); }
.leaders circle.on { fill: var(--accent); }
.tag { position: absolute; right: 12px; pointer-events: auto; display: flex; align-items: center; gap: 8px; max-width: 46%;
  background: rgba(12,13,15,.86); border: 1px solid var(--line); padding: 0 10px; font-weight: 700; font-size: 14px; line-height: 1;
  white-space: nowrap; transition: opacity .25s, border-color .2s; }
.tag .n { font-family: var(--f-mono); font-weight: 400; color: var(--muted); font-size: 12px; }
.tag .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag.on { border-color: var(--accent); color: var(--accent); }
.tag.on .n { color: var(--accent); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,13,15,.72); pointer-events: auto; }
.loading .box { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 0 24px; }
.loading .bar { width: 160px; height: 2px; background: var(--line); overflow: hidden; position: relative; }
.loading .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.loading .msg { font-size: 14px; color: var(--ink); }
.loading .sub { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.info { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 22px 16px; display: grid; gap: 10px; box-shadow: inset 3px 0 0 var(--accent); }
.info-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.info-titles { min-width: 0; }
.info-kind { font-family: var(--f-mono); font-size: 11px; color: var(--accent); letter-spacing: .08em; }
.info h4 { margin: 2px 0 0; font-size: 15px; font-weight: 700; word-break: break-all; }
.info-x { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 18px; line-height: 1; }
.info-desc { display: grid; gap: 4px; }
.info-desc p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
.info-desc .src { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: .02em; }
.info-man blockquote b { color: var(--accent); font-weight: 500; font-family: var(--f-mono); }
.info-grid { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.info-grid dt { color: var(--muted); }
.info-grid dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
.info-man { display: grid; gap: 8px; font-size: 13px; }
.info-man .lbl { font-size: 12px; color: var(--muted); }
.info-man blockquote { margin: 0; padding: 8px 10px; border-left: 2px solid var(--accent); background: var(--panel-2); color: #d8d2c6; line-height: 1.55; }
.info-man mark { background: rgba(227,166,72,.28); color: var(--ink); border-radius: 2px; padding: 0 1px; }
.info-man .ai-btn { justify-self: start; border: 1px solid rgba(227,166,72,.55); background: none; color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.info-man .ai-out { white-space: pre-wrap; line-height: 1.6; }
.viewbtn { position: absolute; left: 12px; bottom: 12px; pointer-events: auto; font-size: 13px; padding: 6px 12px; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 999px; border: 1px solid var(--line); background: rgba(12,13,15,.86); color: var(--ink); }
.viewbtn:hover { border-color: var(--accent); }
.picked { position: absolute; left: 12px; bottom: 50px; font-size: 13px; color: var(--accent); background: rgba(12,13,15,.86); border: 1px solid var(--accent); padding: 2px 10px; pointer-events: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.story { padding: 18px 22px 22px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.story .step { display: flex; align-items: center; gap: 12px; }
.story .badge { width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 16px; flex: none; }
.story .eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.story h2, .story p, .info h4, .layers .t { overflow-wrap: anywhere; }
.story h2 { margin: 2px 0 0; font-size: clamp(24px, 6.4vw, 34px); line-height: 1.2; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.story p { margin: 0; color: #cfc9bd; font-size: 16px; max-width: 62ch; }
.diag { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chips button { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); background: none; padding: 3px 9px; text-align: left; word-break: break-all; }
.chips button:hover { border-color: var(--accent); color: var(--ink); }
.chips button.on { border-color: var(--accent); color: var(--accent); }

.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.btn { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; padding: 6px 6px; white-space: nowrap; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; }
.btn:hover { border-color: #3b4047; }
.btn.accent { color: var(--accent); border-color: rgba(227,166,72,.55); }
.btn.toggle[aria-pressed="true"] { color: var(--accent); border-color: rgba(227,166,72,.55); background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: default; }

/* side column */
.side { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.drops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.drop { position: relative; border: 1px dashed #3a3f45; border-radius: 12px; padding: 12px; display: grid; gap: 2px; min-width: 0; background: var(--panel-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.drop b { font-size: 15px; }
.drop small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; }
.drop .file { font-size: 12px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 18px; }
.samples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.link { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink); }
.link:hover { border-color: var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row label { font-size: 14px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 40px; height: 36px; border: 0; background: var(--panel-2); font-size: 18px; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { width: 44px; text-align: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 7px 12px; font-size: 13px; font-family: var(--f-mono); color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.select { flex: 1 1 160px; min-width: 0; max-width: 220px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); padding: 0 10px; font-size: 14px; }
.note-s { margin: 0; font-size: 12px; color: var(--muted); }
.axl { position: absolute; font-family: var(--f-mono); font-size: 12px; font-weight: 500; pointer-events: none; }
.status { font-size: 13px; color: var(--ink); min-height: 20px; }
.status.err { color: var(--danger); }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.markers { position: absolute; inset: 0; pointer-events: none; }
.mk { position: absolute; left: 0; top: 0; pointer-events: auto; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  border: 1px solid var(--muted); background: rgba(12,13,15,.78); color: var(--ink); font: 500 9px/13px var(--f-mono); text-align: center; }
.mk::before { content: ""; position: absolute; inset: -8px; }       /* small to look at, still easy to tap */
.mk.on { border-color: var(--accent); background: var(--accent); color: #1b1408; z-index: 2; }
.mk-label { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; max-width: 62%; padding: 4px 10px; border: 1px solid var(--accent);
  background: rgba(12,13,15,.92); color: var(--accent); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card h3 small { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); font-weight: 400; }
.side .listcard { order: -1; }
.listcard .layers { max-height: 62vh; overflow: auto; position: relative; overscroll-behavior: contain; }
.layers li .parts { display: grid; gap: 2px; padding: 2px 0 10px 44px; }
.layers li .parts button { text-align: left; background: none; border: 0; border-left: 2px solid var(--line); padding: 5px 10px; font-size: 13px; color: #cfc9bd; word-break: break-all; }
.layers li .parts button:hover { color: var(--ink); border-left-color: var(--muted); }
.layers li .parts button.on { color: var(--accent); border-left-color: var(--accent); }
@media (max-width: 959px) {
  .side { display: contents; }
  .app > .topbar { order: 0; } .app > main { order: 1; } .app .listcard { order: 2; } .app .side > .card:not(.listcard) { order: 3; }
  .listcard .layers { max-height: 46vh; }
}
.layers { list-style: none; margin: 0; padding: 0; display: grid; }
.layers li > .lrow { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 2px; }
.layers li:first-child > .lrow { border-top: 0; }
.layers .n { font-family: var(--f-mono); color: var(--muted); font-size: 12px; justify-self: start; min-width: 22px; height: 22px; line-height: 20px; text-align: center; border: 1px solid var(--line); border-radius: 11px; }
.layers li.on .n { background: var(--accent); border-color: var(--accent); color: #1b1408; }
.layers .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layers .c { font-family: var(--f-mono); color: var(--faint); font-size: 12px; }
.layers li.on .t { color: var(--accent); }
/* ---------- hologram skin ---------- */
:root[data-skin="holo"] {
  --bg: #02080f; --panel: rgba(7, 24, 38, .82); --panel-2: rgba(10, 38, 56, .76); --line: rgba(86, 204, 255, .24);
  --ink: #e2f7ff; --muted: #86b9cc; --faint: #557f91; --accent: #45d8ff; --accent-soft: rgba(69, 216, 255, .16); --danger: #ff8a7a;
}
:root[data-skin="holo"] .frame { border-color: rgba(69, 216, 255, .45); box-shadow: 0 0 28px rgba(69, 216, 255, .10), inset 0 0 40px rgba(69, 216, 255, .06); }
:root[data-skin="holo"] .stage { background: radial-gradient(65% 50% at 50% 58%, rgba(40, 170, 230, .22), transparent 70%), radial-gradient(130% 80% at 50% 115%, rgba(16, 100, 160, .30), transparent 60%), #02080f; }
:root[data-skin="holo"] .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(0deg, rgba(120, 220, 255, .035) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 8, 16, .55) 100%); }
:root[data-skin="holo"] .hud { z-index: 2; }
:root[data-skin="holo"] .brand h1, :root[data-skin="holo"] .story h2 { text-shadow: 0 0 14px rgba(69, 216, 255, .45); }
:root[data-skin="holo"] .story p { color: #bfe3f1; }
:root[data-skin="holo"] .card { box-shadow: inset 0 0 24px rgba(69, 216, 255, .04); }
:root[data-skin="holo"] .btn.accent, :root[data-skin="holo"] .btn.toggle[aria-pressed="true"] { box-shadow: 0 0 12px rgba(69, 216, 255, .18); }
:root[data-skin="holo"] .mk { border-color: rgba(69, 216, 255, .7); color: #cff4ff; box-shadow: 0 0 6px rgba(69, 216, 255, .55); }
:root[data-skin="holo"] .mk.on { color: #01121c; }
:root[data-skin="holo"] .mk-label { box-shadow: 0 0 12px rgba(69, 216, 255, .35); }
:root[data-skin="holo"] .layers li.on .n { color: #01121c; }
:root[data-skin="holo"] .info-man mark { background: rgba(69, 216, 255, .25); }
@media (prefers-reduced-motion: reduce) { .loading .bar::after { animation: none; } }
</style>
